services:
  - type: web
    name: varime-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: varime-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: anthropic
      - key: ALLOWED_ORIGINS
        value: https://varime.vercel.app
      - key: DEBUG
        value: false
      - key: APP_ENV
        value: production

databases:
  - name: varime-db
    databaseName: cervical_ai_db
    user: cerviai
    plan: free
