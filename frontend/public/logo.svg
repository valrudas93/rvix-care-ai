<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="scan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
      <stop offset="30%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="70%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Shield body -->
  <path d="M50 6 L90 21 L90 53 C90 74 72 90 50 97 C28 90 10 74 10 53 L10 21 Z"
        fill="url(#grad)" />

  <!-- Shield inner highlight -->
  <path d="M50 14 L83 27 L83 53 C83 70 67 84 50 90 C33 84 17 70 17 53 L17 27 Z"
        fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Medical cross - vertical bar -->
  <rect x="43.5" y="29" width="13" height="42" rx="4" fill="white" opacity="0.95"/>

  <!-- Medical cross - horizontal bar -->
  <rect x="29" y="43.5" width="42" height="13" rx="4" fill="white" opacity="0.95"/>

  <!-- AI scan line -->
  <line x1="18" y1="50" x2="82" y2="50"
        stroke="url(#scan)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Scan dots -->
  <circle cx="18" cy="50" r="2" fill="rgba(255,255,255,0.7)"/>
  <circle cx="82" cy="50" r="2" fill="rgba(255,255,255,0.7)"/>
</svg>
